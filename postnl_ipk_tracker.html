<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostNL Letter Mail Tracker</title>
<style>
  :root {
    --bg: #f5f4f0; --bg2: #ffffff; --bg3: #eeece6;
    --border: rgba(0,0,0,.1); --border2: rgba(0,0,0,.18);
    --text: #1a1a18; --text2: #6b6a65; --text3: #9e9d97;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; margin-right: auto; }
  .ctrl { display: flex; align-items: center; gap: 6px; }
  .ctrl label { font-size: 12px; color: var(--text2); }
  .sel, .txt, .area {
    border: 1px solid var(--border2); border-radius: var(--radius);
    background: var(--bg3); color: var(--text); padding: 6px 9px; font-size: 12px;
  }
  .sum-chips { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  .chip { font-size: 11px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); border-radius: 20px; padding: 3px 9px; }

  .main { display: flex; height: calc(100vh - 102px); }
  .sidebar { width: 340px; min-width: 340px; border-right: 1px solid var(--border); background: var(--bg2); display: flex; flex-direction: column; }
  .sidebar-search { padding: 10px; border-bottom: 1px solid var(--border); }
  .sidebar-search input { width: 100%; }
  .sidebar-scroll { overflow-y: auto; flex: 1; }
  .country-row { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; cursor: pointer; border-left: 3px solid transparent; }
  .country-row:hover { background: var(--bg3); }
  .country-row.active { border-left-color: #378add; background: #e6f1fb; }
  .c-code { width: 38px; color: var(--text3); font-size: 11px; font-family: Consolas, "Courier New", monospace; padding-top: 2px; }
  .c-main { flex: 1; min-width: 0; }
  .c-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .c-sub { font-size: 10px; color: var(--text3); }
  .detail { flex: 1; padding: 18px 20px; overflow-y: auto; }
  .section { border: 1px solid var(--border); background: var(--bg2); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .section h2 { font-size: 14px; margin-bottom: 10px; }
  .tabs, .subtabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab, .subtab, .btn {
    border: 1px solid var(--border2); border-radius: var(--radius);
    background: var(--bg3); color: var(--text); padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .tab.active, .subtab.active { background: #e6f1fb; border-color: #378add; color: #0c447c; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .item { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .item-title { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .kv { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .kv:last-child { border-bottom: 0; }
  .badge { font-size: 11px; border-radius: 20px; padding: 3px 9px; border: 1px solid transparent; white-space: nowrap; }
  .b-not-started { background: #e8e6df; color: #444; border-color: #888; }
  .b-under-review { background: #faeeda; color: #633806; border-color: #ba7517; }
  .b-final { background: #eaf3de; color: #27500a; border-color: #639922; }
  .b-declined { background: #fcebeb; color: #791f1f; border-color: #e24b4a; }
  .b-yes { background: #eaf3de; color: #27500a; border-color: #639922; }
  .b-no { background: #fcebeb; color: #791f1f; border-color: #e24b4a; }
  .muted { color: var(--text2); font-size: 12px; }
  .empty { color: var(--text3); font-style: italic; }
  .export-row { margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border-bottom: 1px solid var(--border); padding: 8px; text-align: left; font-size: 12px; vertical-align: top; }
  th { color: var(--text2); background: var(--bg3); }
  .mini-btn {
    border: 1px solid var(--border2); border-radius: 6px; background: var(--bg3);
    padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>PostNL Letter Mail Tracker</h1>
  <div class="ctrl">
    <label for="year-sel">Year</label>
    <select id="year-sel" class="sel" onchange="onYearChange(this.value)"></select>
  </div>
  <div class="ctrl">
    <label for="region-filter">Region</label>
    <select id="region-filter" class="sel" onchange="renderAll()"></select>
  </div>
  <div class="ctrl">
    <label for="status-filter">Status</label>
    <select id="status-filter" class="sel" onchange="renderAll()">
      <option>All</option>
      <option>Not started</option>
      <option>Under review</option>
      <option>Final</option>
      <option>Declined</option>
      <option>Yes</option>
      <option>No</option>
    </select>
  </div>
  <div class="sum-chips" id="sum-chips"></div>
</div>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-search">
      <input class="txt" id="search-box" type="text" placeholder="Search country..." oninput="renderAll()">
    </div>
    <div class="sidebar-scroll" id="sidebar-list"></div>
  </aside>
  <main class="detail" id="detail-panel"></main>
</div>

<script>
const CURRENT_USER = 'Elham6461';

const INITIAL_COUNTRIES = [
  {code:'ARA',name:'Argentinie',note:'',region:'Americas',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'AUA',name:'Australie',note:'',region:'Asia-Pacific',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'BRA',name:'Brazilië',note:'',region:'Americas',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'BGA',name:'Bulgarije',note:'',region:'Europe & CIS',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'CAA',name:'Canada',note:'',region:'Americas',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'CLA',name:'Chili',note:'',region:'Americas',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'CNA',name:'China',note:'',region:'Asia-Pacific',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'CYA',name:'Cyprus',note:'',region:'Europe & CIS',category:'REIMS',documentCode:'',extraField1:'',extraField2:''},
  {code:'HKA',name:'Hong Kong',note:'',region:'Asia-Pacific',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'HRA',name:'Kroatië',note:'e53 IPEP',region:'Europe & CIS',category:'REIMS',documentCode:'',extraField1:'',extraField2:''},
  {code:'ISA',name:'Israël',note:'',region:'Europe & CIS',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'JEA',name:'Jersey',note:'excl GBHATA',region:'Europe & CIS',category:'REIMS',documentCode:'',extraField1:'',extraField2:''},
  {code:'JPA',name:'Japan',note:'',region:'Asia-Pacific',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'KRA',name:'Zuid-Korea',note:'',region:'Asia-Pacific',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'MCA',name:'Monaco',note:'',region:'Europe & CIS',category:'REIMS',documentCode:'',extraField1:'',extraField2:''},
  {code:'MTA',name:'Malta',note:'',region:'Europe & CIS',category:'REIMS',documentCode:'',extraField1:'',extraField2:''},
  {code:'MXA',name:'Mexico',note:'',region:'Americas',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'MYA',name:'Maleisië',note:'',region:'Asia-Pacific',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'NZA',name:'New Zealand',note:'',region:'Asia-Pacific',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'RUA',name:'Rusland',note:'',region:'Europe & CIS',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'SGA',name:'Singapore',note:'',region:'Asia-Pacific',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'TRA',name:'Turkije',note:'',region:'Europe & CIS',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'TWA',name:'Taiwan',note:'',region:'Asia-Pacific',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'UKA',name:'Ukraine',note:'',region:'Europe & CIS',category:'UPU',documentCode:'',extraField1:'',extraField2:''},
  {code:'USA',name:'USA',note:'zonder IPEP',region:'Americas',category:'UPU IC',documentCode:'',extraField1:'',extraField2:''},
  {code:'VAA',name:'Vatican City',note:'geen sampling',region:'Europe & CIS',category:'REIMS',documentCode:'',extraField1:'',extraField2:''},
  {code:'ZAA',name:'Zuid-Afrika',note:'',region:'Africa',category:'UPU',documentCode:'',extraField1:'',extraField2:''}
];

const FLOW_STATUSES = ['Not started', 'Under review', 'Final', 'Declined'];
const YEARS = [String(new Date().getFullYear() - 1), String(new Date().getFullYear()), String(new Date().getFullYear() + 1)];
const CATEGORIES = ['Weight', 'IPK', 'Agreement', 'Invoice', 'Countries', 'History'];
const QUARTERS = ['Q1', 'Q2', 'Q3', 'Q4'];
const COUNTRY_CATEGORIES = ['REIMS', 'UPU', 'UPU IC', 'Other'];

let selectedYear = YEARS[1];
let countries = JSON.parse(JSON.stringify(INITIAL_COUNTRIES));
let selectedCountry = countries[0].code;
let activeCategory = 'Weight';
let activeDirection = 'Inbound';
let tracker = {};
let auditLog = [];

function defaultFlow() {
  return {Q1:'Not started', Q2:'Not started', Q3:'Not started', Q4:'Not started'};
}

function defaultRecord() {
  return {
    weight: {inbound: defaultFlow(), outbound: defaultFlow()},
    ipk: {inbound: defaultFlow(), outbound: defaultFlow()},
    agreement: {kg: 'No', uvcn73: 'No', cn6: 'No'},
    invoice: {status: 'Not started', note: ''}
  };
}

function getRecord(year, code) {
  if (!tracker[year]) tracker[year] = {};
  if (!tracker[year][code]) tracker[year][code] = defaultRecord();
  return tracker[year][code];
}

function getCountry(code) {
  return countries.find(c => c.code === code);
}

function addAuditEntry(countryCode, field, oldValue, newValue) {
  if (String(oldValue ?? '') === String(newValue ?? '')) return;
  auditLog.unshift({
    date: new Date().toISOString(),
    user: CURRENT_USER,
    countryCode,
    field,
    oldValue: oldValue ?? '',
    newValue: newValue ?? ''
  });
}

function toBadgeClass(status) {
  return 'b-' + status.toLowerCase().replace(/\s+/g, '-');
}

function summarizeFlow(flow) {
  const values = Object.values(flow);
  if (values.every(v => v === 'Not started')) return 'Not started';
  if (values.includes('Declined')) return 'Declined';
  if (values.includes('Under review')) return 'Under review';
  if (values.every(v => v === 'Final')) return 'Final';
  return 'Under review';
}

function summarizeAgreement(agreement) {
  return Object.values(agreement).every(v => v === 'Yes') ? 'Yes' : 'No';
}

function getContextStatus(record) {
  if (activeCategory === 'Weight') return summarizeFlow(record.weight[activeDirection.toLowerCase()]);
  if (activeCategory === 'IPK') return summarizeFlow(record.ipk[activeDirection.toLowerCase()]);
  if (activeCategory === 'Agreement') return summarizeAgreement(record.agreement);
  if (activeCategory === 'Countries' || activeCategory === 'History') return 'Not started';
  return record.invoice.status;
}

function onYearChange(year) {
  selectedYear = year;
  renderAll();
}

function setCategory(category) {
  activeCategory = category;
  if (category === 'Agreement' || category === 'Invoice' || category === 'Countries' || category === 'History') activeDirection = 'Inbound';
  renderAll();
}

function setDirection(direction) {
  activeDirection = direction;
  renderAll();
}

function updateQuarter(category, direction, quarter, value) {
  const record = getRecord(selectedYear, selectedCountry);
  const oldValue = record[category][direction][quarter];
  record[category][direction][quarter] = value;
  addAuditEntry(selectedCountry, `${category}.${direction}.${quarter}`, oldValue, value);
  renderAll();
}

function updateAgreement(key, value) {
  const record = getRecord(selectedYear, selectedCountry);
  const oldValue = record.agreement[key];
  record.agreement[key] = value;
  addAuditEntry(selectedCountry, `agreement.${key}`, oldValue, value);
  renderAll();
}

function updateInvoiceStatus(value) {
  const record = getRecord(selectedYear, selectedCountry);
  const oldValue = record.invoice.status;
  record.invoice.status = value;
  addAuditEntry(selectedCountry, 'invoice.status', oldValue, value);
  renderAll();
}

function updateInvoiceNote(value) {
  const record = getRecord(selectedYear, selectedCountry);
  const oldValue = record.invoice.note;
  record.invoice.note = value;
  addAuditEntry(selectedCountry, 'invoice.note', oldValue, value);
}

function updateCountryField(code, field, value) {
  const country = getCountry(code);
  if (!country) return;
  const normalizedValue = field === 'code' ? value.toUpperCase() : value;
  const oldValue = country[field] || '';
  if (field === 'code') {
    const newCode = normalizedValue.trim();
    if (!newCode) return;
    if (newCode !== code && getCountry(newCode)) {
      alert('Country code already exists.');
      renderAll();
      return;
    }
    country.code = newCode;
    if (tracker[selectedYear] && tracker[selectedYear][code]) {
      tracker[selectedYear][newCode] = tracker[selectedYear][code];
      delete tracker[selectedYear][code];
    }
    if (selectedCountry === code) selectedCountry = newCode;
  } else {
    country[field] = normalizedValue;
  }
  addAuditEntry(country.code, `country.${field}`, oldValue, normalizedValue);
  initControls();
  renderAll();
}

function addCountryRow() {
  const codeInput = prompt('Enter country code (example: DEA)');
  if (!codeInput) return;
  const code = codeInput.trim().toUpperCase();
  if (getCountry(code)) {
    alert('Country code already exists.');
    return;
  }
  const nameInput = prompt('Enter country name');
  if (!nameInput) return;
  const newCountry = {
    code,
    name: nameInput.trim(),
    note: '',
    region: 'Europe & CIS',
    category: 'Other',
    documentCode: '',
    extraField1: '',
    extraField2: ''
  };
  countries.push(newCountry);
  selectedCountry = newCountry.code;
  addAuditEntry(newCountry.code, 'country.created', '', JSON.stringify(newCountry));
  initControls();
  renderAll();
}

function removeCountryRow(code) {
  const country = getCountry(code);
  if (!country) return;
  if (!confirm(`Delete ${country.name} (${country.code})?`)) return;
  countries = countries.filter(c => c.code !== code);
  addAuditEntry(code, 'country.deleted', JSON.stringify(country), '');
  if (selectedCountry === code) {
    selectedCountry = countries[0] ? countries[0].code : '';
  }
  initControls();
  renderAll();
}

function downloadCSV(rows, fileName) {
  const csv = rows.map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = fileName;
  a.click();
}

function exportYearCSV() {
  const rows = [[
    'Year', 'Code', 'Country', 'Region', 'Country Category', 'Document Code', 'Note', 'Extra Field 1', 'Extra Field 2',
    'Weight Inbound', 'Weight Outbound', 'IPK Inbound', 'IPK Outbound', 'Agreement', 'Invoice'
  ]];
  countries.forEach(country => {
    const record = getRecord(selectedYear, country.code);
    rows.push([
      selectedYear,
      country.code,
      country.name,
      country.region,
      country.category,
      country.documentCode,
      country.note,
      country.extraField1,
      country.extraField2,
      summarizeFlow(record.weight.inbound),
      summarizeFlow(record.weight.outbound),
      summarizeFlow(record.ipk.inbound),
      summarizeFlow(record.ipk.outbound),
      summarizeAgreement(record.agreement),
      record.invoice.status
    ]);
  });
  downloadCSV(rows, `PostNL_Letter_Mail_${selectedYear}.csv`);
}

function exportCountriesCSV() {
  const rows = [['Code', 'Country', 'Region', 'Category', 'Document Code', 'Note', 'Extra Field 1', 'Extra Field 2']];
  countries.forEach(country => {
    rows.push([
      country.code,
      country.name,
      country.region,
      country.category,
      country.documentCode,
      country.note,
      country.extraField1,
      country.extraField2
    ]);
  });
  downloadCSV(rows, 'PostNL_Countries_Master.csv');
}

function exportAuditCSV() {
  const rows = [['Date', 'User', 'Country Code', 'Field', 'Old Value', 'New Value']];
  auditLog.forEach(entry => {
    rows.push([entry.date, entry.user, entry.countryCode, entry.field, entry.oldValue, entry.newValue]);
  });
  downloadCSV(rows, 'PostNL_Audit_Log.csv');
}

function filteredCountries() {
  const q = document.getElementById('search-box').value.toLowerCase();
  const region = document.getElementById('region-filter').value;
  const statusFilter = document.getElementById('status-filter').value;
  return countries.filter(country => {
    if (q && !country.name.toLowerCase().includes(q) && !country.code.toLowerCase().includes(q) && !(country.documentCode || '').toLowerCase().includes(q)) return false;
    if (region !== 'All regions' && country.region !== region) return false;
    if (activeCategory !== 'Countries' && activeCategory !== 'History') {
      const status = getContextStatus(getRecord(selectedYear, country.code));
      if (statusFilter !== 'All' && status !== statusFilter) return false;
    }
    return true;
  });
}

function renderSummary() {
  const counts = {};
  const statusOptions = activeCategory === 'Agreement' ? ['Yes', 'No'] : FLOW_STATUSES;
  statusOptions.forEach(status => counts[status] = 0);
  countries.forEach(country => {
    const status = getContextStatus(getRecord(selectedYear, country.code));
    if (counts[status] !== undefined) counts[status] += 1;
  });
  document.getElementById('sum-chips').innerHTML = statusOptions
    .filter(status => counts[status] > 0)
    .map(status => `<span class="chip">${status}: <strong>${counts[status]}</strong></span>`)
    .join('');
}

function renderSidebar() {
  const list = filteredCountries();
  if (!list.some(country => country.code === selectedCountry)) {
    selectedCountry = list[0] ? list[0].code : '';
  }
  document.getElementById('sidebar-list').innerHTML = list.length === 0
    ? '<div style="padding:12px" class="empty">No countries match the selected filters.</div>'
    : list.map(country => {
      const status = getContextStatus(getRecord(selectedYear, country.code));
      return `
        <div class="country-row${country.code===selectedCountry ? ' active' : ''}" onclick="selectedCountry='${country.code}'; renderAll();">
          <span class="c-code">${country.code}</span>
          <div class="c-main">
            <div class="c-name">${country.name}</div>
            <div class="c-meta">
              <span class="c-sub">${country.region}</span>
              <span class="c-sub">${country.category}</span>
              <span class="c-sub">Doc: ${country.documentCode || '-'}</span>
            </div>
          </div>
          <span class="badge ${toBadgeClass(status)}">${status}</span>
        </div>`;
    }).join('');
}

function renderCategoryTabs() {
  return `<div class="tabs">${CATEGORIES.map(category => `
    <button class="tab${activeCategory===category?' active':''}" onclick="setCategory('${category}')">${category}</button>
  `).join('')}</div>`;
}

function renderWeightOrIpk(record, categoryKey, title) {
  const directionKey = activeDirection.toLowerCase();
  const flow = record[categoryKey][directionKey];
  return `
    <div class="section">
      <h2>${title}</h2>
      <div class="muted" style="margin-bottom:10px">Drill-down: Year → Country → ${title} → ${activeDirection} quarterly status</div>
      <div class="subtabs" style="margin-bottom:10px">
        <button class="subtab${activeDirection==='Inbound'?' active':''}" onclick="setDirection('Inbound')">Inbound</button>
        <button class="subtab${activeDirection==='Outbound'?' active':''}" onclick="setDirection('Outbound')">Outbound</button>
      </div>
      <div class="item">
        ${QUARTERS.map(quarter => `
          <div class="kv">
            <strong>${quarter}</strong>
            <select class="sel" onchange="updateQuarter('${categoryKey}','${directionKey}','${quarter}', this.value)">
              ${FLOW_STATUSES.map(status => `<option value="${status}"${flow[quarter]===status?' selected':''}>${status}</option>`).join('')}
            </select>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderAgreement(record) {
  const items = [
    {key:'kg', label:'Agreement Kg'},
    {key:'uvcn73', label:'Agreement UV CN73'},
    {key:'cn6', label:'Agreement CN6'}
  ];
  return `
    <div class="section">
      <h2>Agreement</h2>
      <div class="muted" style="margin-bottom:10px">Yearly contract status (Yes/No)</div>
      <div class="item">
        ${items.map(item => `
          <div class="kv">
            <span>${item.label}</span>
            <select class="sel" onchange="updateAgreement('${item.key}', this.value)">
              <option value="No"${record.agreement[item.key]==='No'?' selected':''}>No</option>
              <option value="Yes"${record.agreement[item.key]==='Yes'?' selected':''}>Yes</option>
            </select>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderInvoice(record) {
  return `
    <div class="section">
      <h2>Invoice</h2>
      <div class="muted" style="margin-bottom:10px">One yearly invoice record per country</div>
      <div class="grid">
        <div class="item">
          <div class="item-title">Invoice status</div>
          <select class="sel" onchange="updateInvoiceStatus(this.value)">
            ${FLOW_STATUSES.map(status => `<option value="${status}"${record.invoice.status===status?' selected':''}>${status}</option>`).join('')}
          </select>
        </div>
        <div class="item">
          <div class="item-title">Notes</div>
          <textarea class="area" style="width:100%;min-height:74px" placeholder="Optional invoice note..." oninput="updateInvoiceNote(this.value)">${record.invoice.note || ''}</textarea>
        </div>
      </div>
    </div>`;
}

function renderCountriesAdmin() {
  return `
    <div class="section">
      <h2>Countries master table</h2>
      <div class="muted" style="margin-bottom:10px">Manage country category, document code and unique country fields.</div>
      <div class="export-row" style="justify-content:flex-start; margin-bottom:10px;">
        <button class="btn" onclick="addCountryRow()">Add new country</button>
        <button class="btn" onclick="exportCountriesCSV()">Export countries Excel/CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Country</th>
              <th>Region</th>
              <th>Category</th>
              <th>Document code</th>
              <th>Note</th>
              <th>Extra field 1</th>
              <th>Extra field 2</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${countries.map(country => `
              <tr>
                <td><input class="txt" value="${country.code}" onchange="updateCountryField('${country.code}', 'code', this.value)"></td>
                <td><input class="txt" value="${country.name}" onchange="updateCountryField('${country.code}', 'name', this.value)"></td>
                <td><input class="txt" value="${country.region}" onchange="updateCountryField('${country.code}', 'region', this.value)"></td>
                <td>
                  <select class="sel" onchange="updateCountryField('${country.code}', 'category', this.value)">
                    ${COUNTRY_CATEGORIES.map(category => `<option value="${category}"${country.category===category?' selected':''}>${category}</option>`).join('')}
                  </select>
                </td>
                <td><input class="txt" value="${country.documentCode || ''}" onchange="updateCountryField('${country.code}', 'documentCode', this.value)"></td>
                <td><input class="txt" value="${country.note || ''}" onchange="updateCountryField('${country.code}', 'note', this.value)"></td>
                <td><input class="txt" value="${country.extraField1 || ''}" onchange="updateCountryField('${country.code}', 'extraField1', this.value)"></td>
                <td><input class="txt" value="${country.extraField2 || ''}" onchange="updateCountryField('${country.code}', 'extraField2', this.value)"></td>
                <td><button class="mini-btn" onclick="removeCountryRow('${country.code}')">Delete</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderHistory() {
  return `
    <div class="section">
      <h2>Change history</h2>
      <div class="muted" style="margin-bottom:10px">Shows who made the change and on which date.</div>
      <div class="export-row" style="justify-content:flex-start; margin-bottom:10px;">
        <button class="btn" onclick="exportAuditCSV()">Export history Excel/CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>User</th>
              <th>Country</th>
              <th>Field</th>
              <th>Old value</th>
              <th>New value</th>
            </tr>
          </thead>
          <tbody>
            ${auditLog.length === 0 ? '<tr><td colspan="6" class="empty">No changes recorded yet.</td></tr>' : auditLog.map(entry => `
              <tr>
                <td>${new Date(entry.date).toLocaleString()}</td>
                <td>${entry.user}</td>
                <td>${entry.countryCode}</td>
                <td>${entry.field}</td>
                <td>${entry.oldValue || '-'}</td>
                <td>${entry.newValue || '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderDetail() {
  const panel = document.getElementById('detail-panel');
  if (activeCategory === 'Countries') {
    panel.innerHTML = `
      <div class="section">
        <h2>Administration</h2>
        <div class="muted">Use this section to maintain the countries master data.</div>
      </div>
      <div class="section">
        <h2>Category</h2>
        ${renderCategoryTabs()}
      </div>
      ${renderCountriesAdmin()}`;
    return;
  }
  if (activeCategory === 'History') {
    panel.innerHTML = `
      <div class="section">
        <h2>Audit</h2>
        <div class="muted">Track changes by user and date.</div>
      </div>
      <div class="section">
        <h2>Category</h2>
        ${renderCategoryTabs()}
      </div>
      ${renderHistory()}`;
    return;
  }
  if (!selectedCountry) {
    panel.innerHTML = '<div class="section empty">No country selected for the current filters.</div>';
    return;
  }
  const country = getCountry(selectedCountry);
  const record = getRecord(selectedYear, selectedCountry);
  const status = getContextStatus(record);
  const categorySection = activeCategory === 'Weight'
    ? renderWeightOrIpk(record, 'weight', 'Weight')
    : activeCategory === 'IPK'
      ? renderWeightOrIpk(record, 'ipk', 'IPK')
      : activeCategory === 'Agreement'
        ? renderAgreement(record)
        : renderInvoice(record);
  panel.innerHTML = `
    <div class="section">
      <h2>${country.name}</h2>
      <div class="muted">${country.code}${country.note ? ' · ' + country.note : ''} · ${country.region} · ${country.category} · Doc: ${country.documentCode || '-'} · Year ${selectedYear}</div>
      <div style="margin-top:10px"><span class="badge ${toBadgeClass(status)}">${status}</span></div>
    </div>
    <div class="section">
      <h2>Category</h2>
      ${renderCategoryTabs()}
    </div>
    ${categorySection}
    <div class="section">
      <div class="export-row">
        <button class="btn" onclick="exportYearCSV()">Export year overview Excel/CSV</button>
      </div>
    </div>`;
}

function renderAll() {
  renderSummary();
  renderSidebar();
  renderDetail();
}

function initControls() {
  document.getElementById('year-sel').innerHTML = YEARS.map(year => `<option value="${year}"${year===selectedYear?' selected':''}>${year}</option>`).join('');
  const regions = ['All regions', ...new Set(countries.map(country => country.region))];
  document.getElementById('region-filter').innerHTML = regions.map(region => `<option>${region}</option>`).join('');
}

initControls();
renderAll();
</script>
</body>
</html>
